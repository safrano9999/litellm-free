      "proxy_catalog_path": null
    },
    "kilo": {
      "enabled": true,
      "api_base": "https://api.kilo.ai/api/gateway",
      "rpm": null,
      "tpm": null,
      "allowlist": [],
      "denylist": [],
      "proxy_catalog_path": null
    },
    "nous": {
      "enabled": true,
